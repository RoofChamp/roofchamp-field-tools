<style>
:root{--ink:#15181c;--mut:#5b636e;--line:#d6dae0;--acc:#8a2c1f;--tint:#f4f2ee;--warn:#fbf6f5;--bg:#e9e7e3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 font-size:17px;line-height:1.45;overscroll-behavior-y:none}
#app{max-width:720px;margin:0 auto;min-height:100vh;background:#fff;
 display:flex;flex-direction:column;box-shadow:0 0 34px rgba(0,0,0,.09)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2.5px solid var(--ink);
 padding:10px 16px 8px;padding-top:calc(10px + env(safe-area-inset-top))}
.bar{display:flex;align-items:center;gap:10px}
.bar button{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:#fff;
 color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer}
.bar button:active{background:var(--tint)}
.bar button[disabled]{opacity:.35;cursor:default}
.bar .sp{flex:1}
.brand{font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.strip{display:flex;gap:3px;margin-top:9px}
.strip i{flex:1;height:4px;border-radius:2px;background:#e2e5e9;font-style:normal}
.strip i.on{background:var(--acc)}
.strip i.done{background:#b9bfc6}
main{flex:1;padding:18px 16px 30px}
.pnum{float:right;font-size:44px;font-weight:800;color:#eceef1;line-height:.75;letter-spacing:-2px}
h1{font-size:27px;margin:0 10px 0 0;letter-spacing:-.5px;line-height:1.15}
.sit{color:var(--mut);font-size:15.5px;margin-top:8px}
.rule{border-bottom:2.5px solid var(--ink);margin:12px 0 18px}
.b{margin:0 0 18px}
.b .lab{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;font-weight:800;color:var(--mut);margin-bottom:6px}
.b .txt{white-space:pre-wrap;font-size:16.5px;line-height:1.5}
.b.say .lab,.b.script .lab,.b.stop .lab{color:var(--acc)}
.b.say .txt{border-left:3px solid var(--acc);background:var(--tint);padding:12px 14px;font-style:italic;border-radius:0 8px 8px 0}
.b.script .txt{background:var(--acc);color:#fff;padding:13px 15px;border-radius:8px}
.b.stop .txt{border:1.6px solid var(--acc);background:var(--warn);padding:12px 14px;border-radius:8px}
.b.do .txt{border-left:3px solid var(--ink);padding:2px 0 2px 13px}
.b.note .txt{color:#42484f;border-left:3px solid var(--line);padding:2px 0 2px 13px;font-size:16px}
.then{margin-top:24px;border-top:1.5px solid var(--ink);padding-top:14px}
.then .lab{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;font-weight:800;color:var(--mut);margin-bottom:10px}
.br{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;
 background:#fff;border:1.6px solid var(--ink);border-radius:11px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.br:active{background:var(--tint)}
.br.exit{border-color:var(--acc);background:var(--warn)}
.br .go{flex:0 0 auto;background:var(--ink);color:#fff;font-weight:800;font-size:13px;
 padding:4px 9px;border-radius:6px;letter-spacing:.3px}
.br.exit .go{background:var(--acc)}
.br .t{flex:1}
.br .t b{display:block;font-weight:700;font-size:16.5px}
.br .t span{color:var(--mut);font-size:14px}
.crumb{margin-top:26px;font-size:13px;color:var(--mut);line-height:1.7}
.crumb a{color:var(--mut);text-decoration:underline;cursor:pointer}
dialog{border:0;border-radius:14px;padding:0;max-width:640px;width:calc(100% - 28px);
 box-shadow:0 18px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(21,24,28,.5)}
.dh{position:sticky;top:0;background:#fff;padding:14px 16px 10px;border-bottom:2px solid var(--ink);display:flex;gap:10px;align-items:center}
.dh h2{font-size:18px;margin:0;flex:1}
.dh button{font:inherit;font-weight:700;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
.dbody{padding:8px 16px 20px;max-height:70vh;overflow:auto}
#q{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;margin:10px 0 4px}
.ph{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--acc);
 margin:16px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
.ix{display:block;width:100%;text-align:left;font:inherit;background:none;border:0;padding:8px 2px;cursor:pointer;
 border-bottom:1px solid #f0f1f3;font-size:16px}
.ix:active{background:var(--tint)}
.ix b{display:inline-block;width:30px;font-weight:800;color:var(--acc)}
.ix em{font-style:normal;color:var(--mut);font-size:13.5px;display:block;margin-left:30px}
footer{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
 font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:10px}
@media (max-width:420px){h1{font-size:24px}.pnum{font-size:36px}main{padding:16px 13px 26px}}

<script>
const DATA = {"phases": [["1", "The Door"], ["2", "The Table"], ["3", "The Fork"], ["4", "In the File"], ["5", "The Answer"], ["6", "The Engine"], ["7", "Close"]], "nodes": [{"id": "knock", "num": 1, "phase": "1", "title": "The knock", "sit": "You're canvassing. Nobody called you. You have not seen this roof.", "blocks": [{"k": "say", "h": "Say this", "t": "\"Hey. Good afternoon. I'm Travis, I'm the roofer over on [street]. I'm not here about a storm. I haven't seen your roof, so I've got no idea what's up there.\n\nWhat I'm doing on this street is roof condition reports. I get on the roof, I look at how it's aging, what maintenance it needs, how much life you've got left, and I leave you a photo file of your own roof and what I found.\n\nTakes me about twenty minutes and it's yours whether you ever hire me or not. Want me to look at yours while I'm here?\""}, {"k": "say", "h": "If the door is barely open", "t": "\"I'm the roofer working on [street]. I'm doing roof condition reports: twenty minutes, I photograph your roof and leave you the file. Not a storm thing. Want one?\""}, {"k": "note", "h": "Why this works", "t": "You are not offering an inspection or a free estimate. Everybody offers those. You're offering a written photo file of their own roof, which is the one thing a homeowner cannot get for themselves.\n\nAnd \"I haven't seen your roof\" is the whole differentiator. Every other knocker on that street opened by claiming to know something about a roof they only saw from the curb."}], "branches": [{"label": "They say yes", "to": "roof", "num": 4, "dest": "On the roof, in this order"}, {"label": "They object", "to": "door-obj", "num": 2, "dest": "Doorstep objections"}]}, {"id": "door-obj", "num": 2, "phase": "1", "title": "Doorstep objections", "sit": "Answer it. Two answers maximum, then you leave.", "blocks": [{"k": "say", "h": "\"Are you the storm guys?\"", "t": "\"No. Those guys knock after a storm and tell you what's wrong before they've been up there. I do condition reports. Age, maintenance, life left. If there happens to be storm damage up there I'll show it to you in the photos, but I'm not going to stand here and tell you that you have it.\""}, {"k": "say", "h": "\"Is this free? What's the catch?\"", "t": "\"The report's free. The catch is I'm a roofer and I'd like the work someday. If your roof's got eight good years left I'll tell you that and I'll leave you the file anyway, because that's what makes you call me in eight years.\""}, {"k": "say", "h": "\"We already had somebody out.\"", "t": "\"Good. Then you've got a second opinion for free. Did they leave you photos of your roof? … That's the part most guys skip. Twenty minutes and you'll have your own file either way.\"\n\nNever run the other contractor down. Just ask what he left behind."}, {"k": "stop", "h": "Two answers, then you leave", "t": "Never work a third objection at a door. You're building a route, not closing a house."}], "branches": [{"label": "They say yes", "to": "roof", "num": 4, "dest": "On the roof, in this order"}, {"label": "A different objection", "to": "door-obj2", "num": 3, "dest": "Doorstep objections, continued"}, {"label": "Third objection. Card and walk", "to": null, "num": null, "dest": "No job today. The eight-year sale."}]}, {"id": "door-obj2", "num": 3, "phase": "1", "title": "Doorstep objections, continued", "sit": "", "blocks": [{"k": "say", "h": "\"Roof's only five years old.\"", "t": "\"Then this is a short one. Five-year roofs are actually where I find the most installation stuff. Nails high, starter missing at the rakes. If it's clean I'll tell you it's clean, and now you've got it documented from year five, which is worth something the day anything does happen.\""}, {"k": "say", "h": "\"Not interested.\"", "t": "\"Fair enough. Card's here if the ceiling ever spots up. I'm local, I'm not going anywhere.\""}, {"k": "stop", "h": "Third objection. Leave", "t": "Never work a third objection at a door. You're building a route, not closing a house.\n\nThe guy who spends nine minutes on a maybe knocks half the doors of the guy who spends ninety seconds, and the one you walk away from cleanly is the one who calls you in November, because the thing he'll remember is that you didn't push."}], "branches": [{"label": "They say yes", "to": "roof", "num": 4, "dest": "On the roof, in this order"}, {"label": "Card and walk", "to": null, "num": null, "dest": "No job today. The eight-year sale."}]}, {"id": "roof", "num": 4, "phase": "1", "title": "On the roof, in this order", "sit": "", "blocks": [{"k": "do", "h": "The order is not optional", "t": "1.  Age and condition\n2.  Repairs and maintenance\n3.  Storm damage. LAST\n\nA guy who climbs up looking for storm damage finds storm damage, every time, on every roof. A guy who assesses a roof comes down able to describe the whole thing, of which damage is one part.\n\nYou told them at the door you'd assess a roof, not hunt damage. This is what makes that true."}, {"k": "do", "h": "The photo file", "t": "15-20 photos. Not sixty. This becomes Tab 1 of the package."}, {"k": "do", "h": "Leave the file on every roof", "t": "Including the clean ones. Especially the clean ones. Photos, age and condition, what maintenance it needs, roughly how much life is left, and anything you'd fix if it were yours.\n\nThat's the eight-year sale, and almost nobody makes it, because most guys only leave paper when there's a job in it."}], "branches": [{"label": "Come down to the table", "to": "four", "num": 5, "dest": "The four options"}]}, {"id": "four", "num": 5, "phase": "2", "title": "The four options", "sit": "Kitchen table. All four, no lean in your voice.", "blocks": [{"k": "do", "h": "Walk all four", "t": "1.  Do nothing\n2.  Spot repair\n3.  Replace retail\n4.  File a claim\n\nPros and cons on each. No lean. They choose."}, {"k": "stop", "h": "The retail price goes in writing TODAY", "t": "Before anybody has said the word claim. It feels backwards and it's the single most valuable thing on that sheet.\n\nIt doesn't pay off today. It pays off in week seven, if the claim dies you go back at your full original number and they believe it, because they've been holding it since before anything went wrong."}, {"k": "note", "h": "Why no lean", "t": "Trust, need and money make a sale. On a storm file the need and the money are already handled, so trust is the entire job.\n\nAnd if this goes sideways in week six you want to be the guy standing next to them looking at the letter, not the guy who talked them into it."}], "branches": [{"label": "Next. Tell them the homework", "to": "homework", "num": 6, "dest": "The homework. Say it before they pick"}]}, {"id": "homework", "num": 6, "phase": "2", "title": "The homework. Say it before they pick", "sit": "This belongs here, while option four is still one of four choices. Not on filing day.", "blocks": [{"k": "say", "h": "Say this", "t": "\"One thing about option four you should know before you pick it, because it surprises people. On a claim, you're the one who talks to your insurance company. Not me. Every email into that claim comes from your address, in your words.\n\nHere's what that actually looks like: one call to open it, one email to send everything in, and then maybe four or five short ones over the next two months, three or four lines each. I write down what to cover and text it to you every single time.\n\nRoughly an hour of your time, spread over two months. Everything else is mine.\""}, {"k": "say", "h": "The reason. The one you say out loud", "t": "\"Your insurance company has a relationship with you. Not with me. When the question comes from you it's one party to the agreement asking the other what's expected. That's a normal question and it gets a normal answer. When it comes from your roofer, it's a contractor inserting himself into somebody else's business, and it reads differently no matter how it's written.\""}, {"k": "stop", "h": "Don't say \"duties after a loss\"", "t": "Don't cite the policy or explain what it obligates them to do. Say the relationship line and stop.\n\n\"We're roofers. Questions about your policy or coverage go to your carrier or agent.\""}, {"k": "do", "h": "Then show them your phone", "t": "Pull up a text you sent another homeowner, four bullets and a screenshot of one sentence. \"This is what you'll get. That's it.\"\n\nTen seconds. What they're afraid of is a blank page, and you just showed them there isn't one."}], "branches": [{"label": "They push back", "to": "homework-obj", "num": 7, "dest": "Homework objections"}, {"label": "They're fine with it", "to": "pick", "num": 10, "dest": "The closing question"}]}, {"id": "homework-obj", "num": 7, "phase": "2", "title": "Homework objections", "sit": "", "blocks": [{"k": "say", "h": "\"Can't you just handle it?\"", "t": "\"I am handling it. I'm doing the part that takes a roofer. Photos, measurements, the estimate, the code, the shingle report, and telling you exactly what to send and when. What I can't do is be you. It's your policy and your house, and the questions land differently coming from the person who owns both.\""}, {"k": "say", "h": "\"I'm not good at this. I don't know what to say.\"", "t": "\"Nobody is, and you don't have to be. I'm not asking you to argue with anybody. I'm asking you to ask questions I write down for you. And they're short. Three lines, most of them. Here, look at what I send.\""}, {"k": "stop", "h": "\"Just write it and I'll copy and paste it.\"  ← the dangerous one", "t": "It's the easiest thing in the world to say yes to. Don't.\n\n\"I'll do you one better. I'll give you the points and you say it however you'd normally say it. Sounds like you, which is the whole idea. If you'd rather not type it, read it into your phone and let it write it down.\"\n\nA homeowner who pasted eight emails can't hold a line in week six, because none of it was ever theirs."}], "branches": [{"label": "Handled. They'll run it", "to": "pick", "num": 10, "dest": "The closing question"}, {"label": "More pushback", "to": "homework-obj2", "num": 8, "dest": "Homework objections, continued"}, {"label": "They genuinely won't", "to": "wont-run", "num": 9, "dest": "They won't run the file"}]}, {"id": "homework-obj2", "num": 8, "phase": "2", "title": "Homework objections, continued", "sit": "", "blocks": [{"k": "say", "h": "\"Won't it look better from a professional?\"", "t": "\"You'd think so. It's the opposite. A polished letter from a contractor gets read as a contractor pushing a scope. Four plain lines from the homeowner get read as the customer asking a fair question, and that's a lot harder to brush off.\""}, {"k": "say", "h": "\"I don't have time.\"", "t": "\"About an hour, over two months. If that's still too much, that's a real answer, and there's a version of this where you don't do any of it. I put the roof on, you pay me, done in two weeks. Want me to lay that one out instead?\""}, {"k": "say", "h": "\"My wife handles this stuff.\" / \"I'd have to ask my husband.\"", "t": "\"Then let's get them on it now, not in three weeks. Which of you has the email address the insurance company already has? That's who should send everything, and I'll text the points to both of you.\""}, {"k": "note", "h": "The move that makes it stick", "t": "At the presentation meeting, have them send the filing email while you're sitting there. Text the bullets across the table, watch them write it, watch them hit send. Four minutes, and the second email, the one you're not there for, isn't a first anymore."}], "branches": [{"label": "They'll run it", "to": "pick", "num": 10, "dest": "The closing question"}, {"label": "They genuinely won't", "to": "wont-run", "num": 9, "dest": "They won't run the file"}]}, {"id": "wont-run", "num": 9, "phase": "2", "title": "They won't run the file", "sit": "Elderly, overwhelmed, working two jobs, not comfortable writing anything.", "blocks": [{"k": "stop", "h": "Don't push a claim onto them", "t": "A file with a homeowner who won't answer emails is worse than no file. You'll carry it for two months, do all the work anyway, and lose it at the end."}, {"k": "do", "h": "Two honest answers", "t": "1.  Get an adult child or family member added to the file, and text them the bullets instead.\n2.  Go retail. Two Ways, done in a couple of weeks, no adjuster in it.\n\nThe retail conversion here is usually easy, because you just told them the truth about what the other road costs. Nobody else on that street did that."}], "branches": [{"label": "Go retail", "to": "retail", "num": 50, "dest": "Retail"}]}, {"id": "pick", "num": 10, "phase": "2", "title": "The closing question", "sit": "", "blocks": [{"k": "say", "h": "Say this", "t": "\"Here are your options. Here are the pros and cons. Which of these are you most comfortable with?\""}], "branches": [{"label": "1. Do nothing", "to": null, "num": null, "dest": "Leave the paperwork. That's a real answer."}, {"label": "3: replace retail", "to": "retail", "num": 50, "dest": "Retail"}, {"label": "2 or 4. Repair or claim", "to": "fork", "num": 11, "dest": "The fork"}]}, {"id": "fork", "num": 11, "phase": "3", "title": "The fork", "sit": "Look at the roof, not at the homeowner.", "blocks": [{"k": "do", "h": "Two questions, in order", "t": "1.  Has a claim already been filed on this roof?\n2.  Is \"can this be repaired?\" genuinely still an open question?"}], "branches": [{"label": "Already filed", "to": "reactive", "num": 22, "dest": "Reactive, triage first"}, {"label": "Not filed, obvious total loss", "to": "laneA-1", "num": 12, "dest": "Lane A. Collapse the sheet to two"}, {"label": "Not filed. Marginal or scattered", "to": "laneB-1", "num": 15, "dest": "Lane B. Stop them filing"}]}, {"id": "laneA-1", "num": 12, "phase": "3", "title": "Lane A. Collapse the sheet to two", "sit": "", "blocks": [{"k": "say", "h": "Say this", "t": "\"Is it pretty obvious what's going on up there? Repairs aren't an option: it's the majority of your roof, it'll cost more to repair. So we can rule those two out.\n\nThat leaves two: you can buy a roof from me and we put the system on next week, or get your insurance company involved and replace it at the best discount you'll ever get. Which of those two?\""}, {"k": "say", "h": "They say insurance", "t": "\"Can I explain what that process looks like?\""}, {"k": "note", "h": "What just happened", "t": "You presented four options without leaning. Then the roof, not you, eliminated two of them, and they ruled out repair out loud. Hold onto that. It's why the next page is what it is."}], "branches": [{"label": "They pick insurance", "to": "laneA-2", "num": 13, "dest": "Lane A. No fee, and here's why"}, {"label": "They pick retail", "to": "retail", "num": 50, "dest": "Retail"}]}, {"id": "laneA-2", "num": 13, "phase": "3", "title": "Lane A. No fee, and here's why", "sit": "", "blocks": [{"k": "stop", "h": "No sample. No identification. No $650. No viability report.", "t": "The $650 attaches to a repairability question, and they just ruled repair out at the kitchen table. There is no question left to charge for."}, {"k": "note", "h": "Why not", "t": "The fee's whole story is \"code requires a compatible shingle and nobody can answer that from the ground.\" On a roof where you both just agreed repair is off the table, that story collapses, and a $650 fee to answer a visible question is the easiest counter-pitch you'll ever hand the next guy who knocks on that door."}, {"k": "do", "h": "What protects the free work. Paper, not cash", "t": "Two signatures before you build anything:\n\n1.  Four Options sheet, \"file a claim\" checked: the record that THEY chose it.\n2.  Contingency agreement: you're the contractor when it pays.\n\nNo signatures, no package. On Lane A the payment is the signed job."}, {"k": "say", "h": "How to ask for them", "t": "\"Two pieces of paper and I'll get out of your way. This one's just the four options we walked. I'm checking the box for the one you picked, you sign it, and it's your record that you chose it. It doesn't commit you to anything. This second one says if you go ahead with the roof, I'm the one who does the work.\""}], "branches": [{"label": "Signed", "to": "laneA-3", "num": 14, "dest": "Lane A. They file today"}]}, {"id": "laneA-3", "num": 14, "phase": "3", "title": "Lane A. They file today", "sit": "", "blocks": [{"k": "do", "h": "On the phone they give two facts", "t": "Date of loss. Cause of loss. That's all.\n\nThey get a claim number and an inspection date. Both get written down."}, {"k": "do", "h": "Package in 24 hours", "t": "Cover sheet on top\nTab 1  photo file\nTab 2  detailed estimate\nTabs 3 and 4  marked NOT INCLUDED"}, {"k": "stop", "h": "This lane only works if you're actually fast", "t": "The reserve at filing is a placeholder off their average roof claim. The real reserve is set after the adjuster inspects. Everything has to be in the file before he drives out."}, {"k": "note", "h": "Two things that don't happen here", "t": "No presentation meeting, and no script 11. Script 11 explains a viability report, and there is no report on this file. Don't send it out of habit."}], "branches": [{"label": "Next: the filing email", "to": "filing", "num": 26, "dest": "Script 01. The filing email"}]}, {"id": "laneB-1", "num": 15, "phase": "3", "title": "Lane B. Stop them filing", "sit": "", "blocks": [{"k": "say", "h": "Say this", "t": "\"Before you file, let me ask you something. If it turns out we can just spot repair those shingles, that probably doesn't even cross your deductible, and if it does, by a couple hundred bucks. Would you still want to file it, maybe take a rate increase or get dropped, for no money?\n\nIt's your claim and your house, so you can. But I think what we ought to do first is make sure you have a viable claim.\""}, {"k": "note", "h": "What stopping them buys", "t": "A claim filed before the file exists is a claim with a placeholder sitting in it. They haven't filed, so nothing is running, so everything you build over the next week lands in that file before an adjuster is ever assigned.\n\nThat's the whole ballgame. Not the evidence, the order."}], "branches": [{"label": "Next, the $650", "to": "laneB-2", "num": 16, "dest": "Lane B. The $650 ask"}]}, {"id": "laneB-2", "num": 16, "phase": "3", "title": "Lane B. The $650 ask", "sit": "", "blocks": [{"k": "say", "h": "Say this", "t": "\"Bad news, it's $650. Good news, you're not out the money either way.\n\nIf there's a claim, that's a documented expense you incurred investigating your loss and it goes in with your claim records. If there's no claim, or they don't reimburse it, I knock the full $650 off the roof when you hire me.\""}, {"k": "say", "h": "If there's no claim in the conversation at all (retail repair)", "t": "\"You want a repair, and I'd rather sell you a repair than a roof. It's a smaller job and you're happier. The problem is I can't tell you yet whether a repair is legal on this roof. Code says the replacement shingle has to be compatible with what's on there, and yours may not be made anymore.\n\nThat's $650 to find out: I pull a sample, send it out for identification, and give you a written answer. If it comes back repairable, we do the repair and I take the $650 off it. If it comes back not repairable, I take it off the replacement. Either way you're not out the money, and either way you get a real answer instead of a guess.\""}, {"k": "stop", "h": "Two things to get exactly right", "t": "\"You're not out the money\" is YOUR guarantee. Never a prediction the carrier will pay it.\n\nEither/or, never both. Reimbursed means no credit. Credited means there was no reimbursement."}], "branches": [{"label": "They pay", "to": "laneB-4", "num": 18, "dest": "Lane B. Sample and book the return"}, {"label": "They balk", "to": "laneB-3", "num": 17, "dest": "Lane B. They balk"}]}, {"id": "laneB-3", "num": 17, "phase": "3", "title": "Lane B. They balk", "sit": "", "blocks": [{"k": "do", "h": "Four answers, in order", "t": "1.  \"Then let me carry it. You don't owe me for the assessment until the roof gets done, and if it never gets done you don't owe me at all.\"\n\n2.  \"Sign the contingency and I'll carry it. If I'm doing your roof either way, I'll front my own homework.\"\n\n3.  \"Give me a five-star Google review right now, on your phone, and we'll call it a favor.\"\n\n4.  \"Introduce me to two neighbors on this street. That's worth more to me than $650.\""}, {"k": "stop", "h": "None of them is \"fine, I'll do it free\"", "t": "This isn't pride, it's week six. That carrier is going to come back three thousand dollars light and this homeowner has to hold the line for one email. If they've already watched you eat $650 the moment they pushed, they've learned exactly what happens in this relationship when somebody pushes.\n\nSome customers need to hear no. That's the mechanism."}], "branches": [{"label": "One of the four lands", "to": "laneB-4", "num": 18, "dest": "Lane B. Sample and book the return"}, {"label": "Still no", "to": "retail", "num": 50, "dest": "Retail"}]}, {"id": "laneB-4", "num": 18, "phase": "3", "title": "Lane B. Sample and book the return", "sit": "", "blocks": [{"k": "do", "h": "On the roof", "t": "Sample comes off a back slope, NOT the damaged area. \"that one is evidence on your claim and I don't want to remove it.\"\n\nDry it in the same day."}, {"k": "stop", "h": "Book the return appointment before you get in the truck", "t": "About a week out. A real appointment on a real calendar is what keeps a marginal file from drifting three weeks."}, {"k": "note", "h": "The week the ID is out costs you nothing", "t": "They haven't filed. Nothing is running. The appointment you just booked IS the delivery date.\n\nThe deadline is never the phone call. The deadline is always the inspection, and there isn't one yet."}], "branches": [{"label": "The ID comes back", "to": "report", "num": 19, "dest": "Build the viability report"}]}, {"id": "report", "num": 19, "phase": "3", "title": "Build the viability report", "sit": "About twenty minutes. Six to ten pages. Roughly 70% pre-built, 30% per job.", "blocks": [{"k": "do", "h": "Four sections", "t": "1.  Findings summary: the question written out, the answer, and the three basis checkboxes.\n2.  Repair assessment: age, condition, brittleness, the test repair, whether working the area creates new damage.\n3.  Shingle identification: the third-party report inserted VERBATIM, plus one paragraph on availability.\n4.  Code and manufacturer requirements: pulled from your library, never written fresh."}, {"k": "note", "h": "It isn't a separate document", "t": "It becomes Tabs 3 and 4 of the Evidence Package. Photos and estimate still lead; code stays at the back."}, {"k": "stop", "h": "It has to be able to say yes", "t": "If your report can only ever say \"replace,\" it isn't an assessment, it's a toll, and the first adjuster who sees three in a row will treat it that way, and he'll be right."}], "branches": [{"label": "Repairable", "to": null, "num": null, "dest": "RETAIL REPAIR. Do the repair, credit the $650 against it."}, {"label": "Not repairable", "to": "s11", "num": 20, "dest": "Script 11. The explanation email"}]}, {"id": "s11", "num": 20, "phase": "3", "title": "Script 11. The explanation email", "sit": "The one email YOU send. A contractor explaining a roof to his customer.", "blocks": [{"k": "script", "h": "Script 11", "t": "Subject: Why your roof can't be spot repaired. [address]\n\n\"Thanks for taking the time to go through this with me today.\n\nI know you'd rather repair the roof than replace it, and normally I'd be glad to do exactly that. I've done thousands of repairs. Unfortunately yours can't be repaired, and I want to be sure you're clear on why.\n\n1.  Your shingle is [product], discontinued in [year]. The attached identification report confirms no compatible product is currently manufactured.\n2.  Code requires that replacement materials be compatible with the existing system. The applicable section is attached.\n3.  [Condition or brittleness note, if it applies.]\n\nAll of the supporting documentation is attached. If any of it doesn't make sense, call me and I'll walk you through it again.\""}, {"k": "note", "h": "Why it comes from you", "t": "When the homeowner forwards it into their own claim it pulls the smell of contractor off the evidence. And at the next speed bump they don't call you confused: they scroll back and find the code section and the report already sitting in their inbox."}], "branches": [{"label": "Next. The presentation", "to": "present", "num": 21, "dest": "The presentation"}]}, {"id": "present", "num": 21, "phase": "3", "title": "The presentation", "sit": "Zoom, phone, kitchen table. Doesn't matter. This looks like a formality. It's the most underrated move in the system.", "blocks": [{"k": "say", "h": "Walk the package, then ask", "t": "\"Here's why your roof can't be spot repaired. Are you in agreement? Did I misinterpret any of this? Does it seem reasonable?\""}, {"k": "say", "h": "Then the one that matters", "t": "\"You're not a roofer or a construction expert, but did you understand the information we put together? … Is there any reason an adjuster who does this for a living wouldn't understand it?\""}, {"k": "note", "h": "Sit with that second question", "t": "You just had the homeowner say out loud that the evidence is plain enough for a professional to follow. Six weeks from now, when the adjuster writes back that he sees it differently, they've already reached their own conclusion, and it wasn't handed to them, they arrived at it answering your question."}, {"k": "do", "h": "Have them send the filing email while you're sitting there", "t": "Text the bullets across the table, watch them write it, watch them hit send. Four minutes. Now the second email, the one you're not there for, isn't a first."}], "branches": [{"label": "Now they file", "to": "filing", "num": 26, "dest": "Script 01. The filing email"}]}, {"id": "reactive", "num": 22, "phase": "3", "title": "Reactive. Triage first", "sit": "On the phone, before you schedule an inspection.", "blocks": [{"k": "do", "h": "Ask these", "t": "When was the storm, and when did you file?\nHAS THEIR ADJUSTER BEEN OUT YET?  ← the answer that decides everything\nWhat did they send you?\nWhat did you send them?\nDid you ever ask whether anything else was required?\nHave you been paid anything yet?"}, {"k": "do", "h": "Ask them to forward you", "t": "The carrier's scope and estimate · the denial or partial-approval letter · every email between them and the adjuster · any photos the adjuster took · the claim number, adjuster name, and claims email.\n\nRead all of it before you go out."}, {"k": "stop", "h": "Two ways to blow it", "t": "1.  Trashing the last contractor or the adjuster. You're inheriting a file, not litigating its history, and every shot lands partly on the homeowner.\n2.  Promising you can reopen or increase it. \"I can't tell you what they'll do. What I can do is make sure they have the information they should have had from the start.\""}], "branches": [{"label": "Adjuster hasn't been out", "to": "reactive-A", "num": 23, "dest": "State A. Filed, not inspected"}, {"label": "Inspected, no decision yet", "to": "reactive-B", "num": 24, "dest": "State B. Inspected, no decision"}, {"label": "Decision already issued", "to": "reactive-C", "num": 25, "dest": "State C. Decision already issued"}]}, {"id": "reactive-A", "num": 23, "phase": "3", "title": "State A. Filed, not inspected", "sit": "You are not reactive. The window is still open and nothing has been lost.", "blocks": [{"k": "do", "h": "Run the standard play, fast", "t": "The inspection is the deadline. Move."}, {"k": "stop", "h": "If the roof is marginal, two-wave delivery", "t": "WAVE 1, SAME DAY. The file must not be empty when he drives out: photos, detailed estimate, and script 01, plus one added line:\n\n\"I'm having additional documentation prepared on whether the damaged area can be repaired, and I'll forward it as soon as I have it.\"\n\nSample comes off the same visit. ID goes out expedited.\n\nWAVE 2, when the ID lands. Forwarded as a follow-up, bullet by bullet, one attachment each.\n\nIf the inspection beats the ID you still won the thing that matters: the record shows more was disclosed as coming, in writing, before anyone inspected."}], "branches": [{"label": "Next. The filing email", "to": "filing", "num": 26, "dest": "Script 01. The filing email"}]}, {"id": "reactive-B", "num": 24, "phase": "3", "title": "State B. Inspected, no decision", "sit": "", "blocks": [{"k": "do", "h": "Get everything in before the decision letter", "t": "The reserve is already set, and it was set against an empty file. You're not setting the number anymore, but you're reaching them before they've written one down and defended it."}], "branches": [{"label": "Next. The filing email", "to": "filing", "num": 26, "dest": "Script 01. The filing email"}]}, {"id": "reactive-C", "num": 25, "phase": "3", "title": "State C. Decision already issued", "sit": "Full reactive. Somebody has committed to a position in writing.", "blocks": [{"k": "stop", "h": "Do not send a fifteen-page report", "t": "Not into a file that already has a position in it.\n\nGo bullet point by bullet point in the EMAIL BODY, one attachment each. Here's why it can't be spot repaired, here's the code, here's repairability, here's compatibility.\n\nAn adjuster and his manager are each comfortable with different things. Laid out this way they can find the one thing they can approve, click it, and ignore the rest."}, {"k": "script", "h": "Their email to the carrier. Restart the clock", "t": "\"I've had a contractor go through my roof in detail and I want to be sure you have everything I have. Attached are photographs, a detailed estimate, and the documentation behind it, including why the damaged area can't be repaired.\n\nPlease have this reviewed. I believe I'm now doing everything I'm supposed to do. If there's anything else you require from me, will you please let me know?\"\n\nThe word is \"now.\" Today becomes the date everything was provided."}, {"k": "note", "h": "What's still entirely yours", "t": "Every fact. Repairability, compatibility, code, manufacturer requirements, and a detailed estimate. Evidence doesn't expire. Nobody disproved anything: they decided without it."}], "branches": [{"label": "Go to the engine", "to": "engine", "num": 34, "dest": "Before you write one word"}]}, {"id": "filing", "num": 26, "phase": "4", "title": "Script 01. The filing email", "sit": "Same day they file, right after they have the claim number. This one has to beat the adjuster to the file.", "blocks": [{"k": "script", "h": "Script 01", "t": "Subject: Claim #[number]. [property address]\n\n\"Thank you for scheduling the adjuster. I wanted to get you all the information I have. Please have your adjuster review it before he comes out.\n\nAttached are photographs of the damage and a detailed estimate to repair it.\n\nI believe I'm doing everything I'm supposed to do. If there's anything else you require from me, will you please let me know?\""}, {"k": "note", "h": "The last sentence is a seed", "t": "It costs nothing today and does nothing today. Once it's asked in writing there are only three possible states and you're better off in all three: they answer with a list (you learn the complete requirement set in week one), they say \"no, that's everything\" (completeness is locked), or they ignore it (their non-answer is on the record, with a date).\n\nPut it at the bottom of every message for the life of the file."}, {"k": "do", "h": "Housekeeping that matters", "t": "Claim number first in the subject. Adjusters work queues by number.\nName attachments like a person would: \"Photos. 1423 Oak Ridge.pdf,\" not \"IMG_export_final_v2.\""}], "branches": [{"label": "Next. Why the timing matters", "to": "timing", "num": 27, "dest": "The only deadline that matters"}]}, {"id": "timing", "num": 27, "phase": "4", "title": "The only deadline that matters", "sit": "", "blocks": [{"k": "stop", "h": "Get this exactly right. People repeat it backwards", "t": "When they call it in, the carrier does NOT set a reserve. They drop in a placeholder based on their average roof claim.\n\nThe REAL reserve gets set AFTER the adjuster inspects and confirms a covered loss."}, {"k": "note", "h": "So what", "t": "The window that matters is between filing and the inspection, and everything you built has to be sitting in that file before he drives out.\n\nA reserve set against a documented $20,000 scope routes to somebody who can approve $20,000. A reserve set against nothing goes to somebody who can't approve anything, and the file crawls for two months while you wonder why nobody will make a decision.\n\nRoughly one in ten robust files gets approved with no site visit at all."}], "branches": [{"label": "Next. The goalposts", "to": "goalpost-u", "num": 28, "dest": "Universal goalposts"}]}, {"id": "goalpost-u", "num": 28, "phase": "4", "title": "Universal goalposts", "sit": "Short, friendly questions asked while the adjuster still has nothing to defend. Every yes is a fencepost.", "blocks": [{"k": "script", "h": "Script 02. Send within a day of their first reply", "t": "\"Thank you, we look forward to that.\n\nI did have a couple of questions as I prepare. I know I have a deductible. Should I expect to spend any other money out of pocket? And is it fair to say we both want the work done to current code and in a workmanlike manner?\n\nAs always, if there's anything else you require from me, please let me know.\""}, {"k": "script", "h": "Script 03, question 1", "t": "\"My understanding is that the local building department sets the code requirements, not the adjuster. Is that right?\""}, {"k": "note", "h": "Why these three never expire", "t": "None of them asks what's OWED. The first asks what the homeowner should expect to spend, the second states a shared goal nobody argues with, and the third is about who has AUTHORITY over code.\n\nThere is no version of this claim where saying yes costs them anything, so they work on any file, in any bucket, on any day."}, {"k": "stop", "h": "Question 1 is worth MORE on a repair scope, not less", "t": "The whole repairability fight is a code fight. Compatibility is a code requirement. Getting this yes before you raise compatibility is the setup for the entire argument."}], "branches": [{"label": "Next. The assembly gate", "to": "gate", "num": 29, "dest": "The assembly gate"}]}, {"id": "gate", "num": 29, "phase": "4", "title": "The assembly gate", "sit": "Script 03's second question is CONDITIONAL. This page is the decision.", "blocks": [{"k": "do", "h": "The question", "t": "\"And am I correct that the full roof assembly is being replaced?\""}, {"k": "note", "h": "What it's for", "t": "Code defines a roof assembly as substrate, vapor retarder, insulation and surface. A yes here is a yes to the DECKING. Given back weeks before anybody knew there was a decking problem, when refusing would have looked strange.\n\nIt has exactly one job, and that job doesn't exist until replacement is on the table. Assembly is not the fight for replacement. It's what you spend after you've won it."}, {"k": "stop", "h": "The window", "t": "ASK IT if they haven't taken a position yet. Pre-inspection, no scope issued. You'll get a hedged yes: \"yes, assuming replacement is warranted.\" That still holds.\n\nASK IT if replacement is already in their own scope. Free yes again.\n\nHOLD IT if a repair scope or a denial is already in writing. You'd be asking them to say NO, in writing, about a position they now have to defend. Turning a free yes into a documented denial."}, {"k": "note", "h": "Where script 03 misleads you", "t": "Its stated timing reads \"a few days later, or immediately after their scope arrives.\" Read it as: after a scope arrives THAT INCLUDES REPLACEMENT."}], "branches": [{"label": "No position in writing yet. Send it", "to": "inspect", "num": 30, "dest": "The inspection"}, {"label": "Repair scope or denial already in writing. Hold it", "to": "engine", "num": 34, "dest": "Before you write one word"}]}, {"id": "inspect", "num": 30, "phase": "4", "title": "The inspection", "sit": "", "blocks": [{"k": "do", "h": "Be there", "t": "If this is the kind of file that draws an engineer: hand him a printed binder of everything on the front porch, in front of the doorbell camera, and have the homeowner ask him to review it before he inspects. Three moves, and most of the engineer problem goes away."}, {"k": "do", "h": "Every homeowner email, every time", "t": "Claim number first. Under five lines. Wait a day before answering bad news. Ends with the seed sentence.\n\nYou text bullet points or a screenshot. Never something to copy and paste."}], "branches": [{"label": "The answer comes back", "to": "buckets", "num": 31, "dest": "Which bucket?"}]}, {"id": "buckets", "num": 31, "phase": "5", "title": "Which bucket?", "sit": "Every file lands in one of three, and each has exactly one correct next move.", "blocks": [{"k": "do", "h": "The three", "t": "FULL APPROVAL at your number, roughly 30-40%.\n\nSCOPE APPROVAL, short on price. The big middle. Replacement IS in their own written scope.\n\nREPAIR SCOPE OR DENIAL. The rest. Nothing has been approved."}], "branches": [{"label": "Full approval at your number", "to": "b1", "num": 32, "dest": "Bucket 1. Full approval"}, {"label": "Roof approved, their price", "to": "b2", "num": 33, "dest": "Bucket 2. Approved, short on price"}, {"label": "Repair scope or denial", "to": "engine", "num": 34, "dest": "Before you write one word"}]}, {"id": "b1", "num": 32, "phase": "5", "title": "Bucket 1. Full approval", "sit": "", "blocks": [{"k": "do", "h": "Do nothing clever", "t": "Don't call. Don't get creative.\n\n\"Oakridge or Duration? Black, brown, or gray?\""}], "branches": [{"label": "Build it", "to": "build", "num": 47, "dest": "Contract, check, schedule"}]}, {"id": "b2", "num": 33, "phase": "5", "title": "Bucket 2. Approved, short on price", "sit": "", "blocks": [{"k": "stop", "h": "First. Did you ever get the assembly answer?", "t": "If you never asked it, ASK IT NOW. The window is open again: replacement is in their own scope, so \"am I correct that the full roof assembly is being replaced?\" is a free yes. Get it before you talk about price."}, {"k": "script", "h": "Script 08. The one email", "t": "\"Thank you for the approval.\n\nAs we previously discussed, my understanding is that my only out-of-pocket expense would be my deductible, and that all remaining costs above that amount would be covered.\n\nPlease confirm this is accurate based on the attached documentation.\"\n\nThat's the whole email. It works entirely because of scripts 02 and 03."}, {"k": "stop", "h": "Never settle the gap", "t": "Their $17,300 against your $20,150. Your materials and labor cost the same either way: that $2,850 is pure profit. Multiply it by your roofs per year before deciding it isn't worth one email.\n\nAnd no line-item war. The email just sets their own written answer next to their own estimate and asks them to reconcile the two."}], "branches": [{"label": "Revised scope issued", "to": "build", "num": 47, "dest": "Contract, check, schedule"}]}, {"id": "engine", "num": 34, "phase": "6", "title": "Before you write one word", "sit": "A repair scope or a denial has landed.", "blocks": [{"k": "stop", "h": "Wait a day", "t": "The same-hour reply is the one that loses files."}, {"k": "stop", "h": "And do not ask about assembly", "t": "See the assembly gate. Once \"repair\" is in writing, that question makes them say no in writing."}, {"k": "do", "h": "What the fight actually is", "t": "Repairability and compatibility. Never \"there's more damage than you think\": that's a dispute you can't win from the ground. Codes and manufacturer specs do the work; the homeowner asks the questions."}], "branches": [{"label": "Next. Script 04", "to": "s04a", "num": 35, "dest": "Script 04. The first two questions"}]}, {"id": "s04a", "num": 35, "phase": "6", "title": "Script 04. The first two questions", "sit": "", "blocks": [{"k": "script", "h": "Script 04, first half", "t": "\"Thank you for the update. Before I respond, two questions so I understand where we are.\n\nDid you have a chance to review the photographs and documentation I sent on [date]?\n\nAnd which part of it do you disagree with, or is there something you'd like me to explain further?\""}, {"k": "note", "h": "The order is the whole thing", "t": "One and two are reasonable on their face and cost nothing. The evidence question only reads as fair after those two have been dodged. Lead with it and they dig in."}], "branches": [{"label": "They answer", "to": "filter", "num": 36, "dest": "Agree or disprove"}]}, {"id": "filter", "num": 36, "phase": "6", "title": "Agree or disprove", "sit": "Run this filter on every single adjuster response, before you write anything.", "blocks": [{"k": "do", "h": "Three possible states, and only three", "t": "AGREED. Done. Move on and don't get clever.\n\nDISPROVED, with actual evidence. Close to a once-a-career event. Concede it fast or rebut on the merits. If you're wrong, say so quickly and pivot to the next piece of support.\n\nNEITHER. Deflected, denied, or ignored. This is nearly always the answer."}, {"k": "note", "h": "Why the filter exists", "t": "It removes improvisation. You're never inventing a response: you're identifying which of three situations you're in and running the corresponding move."}], "branches": [{"label": "Agreed", "to": "buckets", "num": 31, "dest": "Which bucket?"}, {"label": "Disproved with evidence", "to": "buckets", "num": 31, "dest": "Which bucket?"}, {"label": "Neither. A deflection", "to": "deflect", "num": 37, "dest": "Which deflection?"}]}, {"id": "deflect", "num": 37, "phase": "6", "title": "Which deflection?", "sit": "Don't chase the point they raised and don't justify yourself. Find the fallacy.", "blocks": [{"k": "do", "h": "Pick the one that matches", "t": "Coverage-flavored · they wave off one of your documents · it's a repair scope specifically · a requirement shows up late · the question isn't yours to answer · they simply won't answer."}], "branches": [{"label": "\"We only owe for direct physical damage\"", "to": "d-cov", "num": 38, "dest": "Coverage-flavored deflection"}, {"label": "They wave off a document", "to": "d-doc", "num": 39, "dest": "They wave off one of your documents"}, {"label": "It's a repair scope", "to": "d-rep", "num": 40, "dest": "It's a repair scope specifically"}, {"label": "A requirement shows up late", "to": "d-late", "num": 41, "dest": "A requirement shows up late"}, {"label": "Not your question to answer", "to": "d-lane", "num": 42, "dest": "Not your question to answer"}, {"label": "Silence. Twice, dated", "to": "d-none", "num": 43, "dest": "They simply won't answer"}]}, {"id": "d-cov", "num": 38, "phase": "6", "title": "Coverage-flavored deflection", "sit": "", "blocks": [{"k": "script", "h": "Script 05", "t": "\"Thank you. I'm not a policy expert, so I'd rather make sure I understand the outcome than the wording.\n\nI thought the purpose of the claim was to put my property back in the condition it was in before the storm. If only the damaged shingles were replaced, would my roof look the way it did beforehand, or would it look worse?\n\nIf it would look worse, I don't believe I've been made whole. Can you help me understand how we get there?\""}, {"k": "note", "h": "Never argue coverage", "t": "Ask about the roof, which is the one thing everybody in the conversation can see. They have to say worse."}], "branches": [{"label": "Next. The evidence question", "to": "evidence", "num": 44, "dest": "The question that runs everything"}]}, {"id": "d-doc", "num": 39, "phase": "6", "title": "They wave off one of your documents", "sit": "\"That bulletin only applies to replacement, not repair.\"", "blocks": [{"k": "script", "h": "Script 06", "t": "\"Oh. I didn't realize that. Just so we're clear, what evidence do you have that supports the opinion that [the manufacturer's bulletin] applies only to replacement and not to repair?\""}, {"k": "note", "h": "Eighteen words", "t": "Their own sentence goes back inside the question. Now they have to defend a position they never supported."}], "branches": [{"label": "Next. The evidence question", "to": "evidence", "num": 44, "dest": "The question that runs everything"}]}, {"id": "d-rep", "num": 40, "phase": "6", "title": "It's a repair scope specifically", "sit": "This is the question that does the work, and it lives inside their own estimate.", "blocks": [{"k": "script", "h": "Ask this", "t": "\"Can you tell me what product you've scoped for the repair?\""}, {"k": "script", "h": "Then, because they already agreed who sets code", "t": "\"Am I correct that whatever's used for the repair has to be compatible with what's on the roof now?\""}, {"k": "note", "h": "Why it lands", "t": "They wrote a repair line item. Ask them to name the material. If your shingle is discontinued there isn't one, and that isn't your argument, it's a hole in their own estimate.\n\nAttach the identification report. One attachment, not a rebuttal letter."}], "branches": [{"label": "Next. The evidence question", "to": "evidence", "num": 44, "dest": "The question that runs everything"}]}, {"id": "d-late", "num": 41, "phase": "6", "title": "A requirement shows up late", "sit": "Week six. \"We can't proceed until we receive X.\" This is what script 01 was for.", "blocks": [{"k": "script", "h": "Script 10", "t": "\"Happy to get that to you.\n\nHelp me with the timeline, though, on [date] I sent everything I had and asked whether anything else was required for my claim. Your reply on [date] didn't mention this. Is there a reason it's coming up now?\""}, {"k": "note", "h": "What it is and isn't", "t": "Not an accusation, and deliberately not an argument about whether the requirement is legitimate. That argument is a trap that costs a week. It's a question with two dates attached, and it drops them straight back into agree-or-disprove.\n\nThe requirement usually just evaporates."}], "branches": [{"label": "Next. The evidence question", "to": "evidence", "num": 44, "dest": "The question that runs everything"}]}, {"id": "d-lane", "num": 42, "phase": "6", "title": "Not your question to answer", "sit": "Anything that would put you in the policy, the cause determination, or the adjusting.", "blocks": [{"k": "script", "h": "Script 12. Fill in what they ACTUALLY asked", "t": "\"[Homeowner] asked me about [their real question]. I didn't want to step outside my lane, since that really isn't my call. Would you be able to help her understand it?\""}, {"k": "stop", "h": "Fill the bracket", "t": "The template's example is thermal cracking vs wind damage. That's an EXAMPLE. Put in the question they actually asked, or you've put a question they never asked onto the claim record."}, {"k": "note", "h": "What it buys", "t": "The question lands with the person whose call it is, the homeowner asks the follow-up herself, and you stay a roofer. Photos, scope, price, code, shingles."}], "branches": [{"label": "Next. The evidence question", "to": "evidence", "num": 44, "dest": "The question that runs everything"}]}, {"id": "d-none", "num": 43, "phase": "6", "title": "They simply won't answer", "sit": "Only after the same question has been asked in writing at least twice, with dates, and gone unanswered.", "blocks": [{"k": "script", "h": "Script 07. Unwilling or unable", "t": "\"I'm a little concerned. We've asked this question several times now, on [date] and again on [date], and it hasn't been answered.\n\nI'm not sure whether you're unwilling to answer it or unable to. If you're unwilling, that would suggest something is being kept from me, and I'm sure that isn't the case. So I have to assume you're unable.\n\nIf you're unable to answer a straightforward question about my own claim, I no longer feel confident that it's being properly adjusted. Would you please forward this to someone who is able to answer it?\""}, {"k": "note", "h": "Why it's built that way", "t": "Two doors, both bad, and you hand them the polite one yourself. It closes with a request rather than a threat. It only lands because of the dates in the first line.\n\nDon't reach for it in week one. It needs a record under it."}, {"k": "stop", "h": "What you're escalating on", "t": "The fallacy, not the roof. They aren't permitted to ignore the insured's evidence or refuse to answer the insured's questions."}], "branches": [{"label": "It gets escalated", "to": "filter", "num": 36, "dest": "Agree or disprove"}, {"label": "Still nothing", "to": "stuck", "num": 46, "dest": "Still stuck"}]}, {"id": "evidence", "num": 44, "phase": "6", "title": "The question that runs everything", "sit": "It follows every deflection. Write it down. Memorize it.", "blocks": [{"k": "script", "h": "Say it, then stop", "t": "\"Thank you. Just so I'm clear: what evidence do you have that supports that?\""}, {"k": "note", "h": "Why you never do more than this", "t": "The instinct when a carrier pushes back is to prove yourself right. More documentation, longer emails, another code section. That's the trap. You already submitted evidence; the burden isn't sitting with you anymore. Their position is the thing lacking support.\n\nYou never chase, justify, or research a big rebuttal. You reverse the burden and let them come up empty."}], "branches": [{"label": "They replied. Run the filter again", "to": "filter", "num": 36, "dest": "Agree or disprove"}, {"label": "No answer, asked twice, dated", "to": "d-none", "num": 43, "dest": "They simply won't answer"}, {"label": "The position moved", "to": "moved", "num": 45, "dest": "The position moved"}]}, {"id": "moved", "num": 45, "phase": "6", "title": "The position moved", "sit": "", "blocks": [{"k": "do", "h": "Where did it land?", "t": "If replacement is now in their scope, you're in bucket 2, and the assembly window just reopened.\n\nIf it's still repair-only or still denied after they've actually engaged, you're at the end of what you can do."}], "branches": [{"label": "Replacement now in their scope", "to": "b2", "num": 33, "dest": "Bucket 2. Approved, short on price"}, {"label": "Still repair-only or denied", "to": "stuck", "num": 46, "dest": "Still stuck"}]}, {"id": "stuck", "num": 46, "phase": "6", "title": "Still stuck", "sit": "", "blocks": [{"k": "do", "h": "You've done your job", "t": "The evidence is in, the questions are dated, and nobody disproved anything."}, {"k": "stop", "h": "What happens next is not your lane", "t": "Appraisal, a public adjuster, an attorney. That's the HOMEOWNER'S call. You don't recommend it, you don't steer it, and you don't interpret the policy.\n\n\"I can't tell you what they'll do. What I can do is make sure they have the information they should have had from the start.\""}, {"k": "note", "h": "Often the honest answer is retail", "t": "Especially if they've been paid ACV and cashed it. Take the money, put a real roof on at retail with the difference. The retail conversion is usually stronger here. They've been through the ringer and you're the first person who showed them the actual facts."}], "branches": [{"label": "They'd rather just get it done", "to": "retail", "num": 50, "dest": "Retail"}]}, {"id": "build", "num": 47, "phase": "7", "title": "Contract, check, schedule", "sit": "", "blocks": [{"k": "do", "h": "Then watch the tear-off", "t": "Bad decking, gaps over 1/4 inch, delamination."}], "branches": [{"label": "Discovery at tear-off", "to": "discovery", "num": 48, "dest": "Discovery and the change order"}, {"label": "Clean tear-off", "to": "fee", "num": 49, "dest": "The $650 on an insured job"}]}, {"id": "discovery", "num": 48, "phase": "7", "title": "Discovery and the change order", "sit": "", "blocks": [{"k": "say", "h": "Say it to the homeowner like this", "t": "\"It's not my opinion. Here's the code, here's the manufacturer spec, here's the tape measure in the photo. Do you understand why I can't put a new roof on this deck? … So there's going to be a change order. Good news: send that invoice in with this evidence and it should be covered.\""}, {"k": "script", "h": "Script 09. The homeowner sends it", "t": "\"During the tear-off my contractor found [condition]. Attached is the change order, along with the applicable code section, the manufacturer's requirement, and a photograph showing the measurement.\n\nMy understanding is that this has to be corrected for the work to be code compliant, which I believe we were in agreement on earlier. Please let me know if anything further is required to have it included.\""}, {"k": "note", "h": "That last clause is \"assembly,\" being spent", "t": "Paid as submitted roughly 60-80% of the time. And your paper always said ESTIMATE: discoveries are allowed."}], "branches": [{"label": "Next. The $650", "to": "fee", "num": 49, "dest": "The $650 on an insured job"}]}, {"id": "fee", "num": 49, "phase": "7", "title": "The $650 on an insured job", "sit": "", "blocks": [{"k": "stop", "h": "Submit it. Don't credit it.", "t": "The invoice goes into the claim file as a documented expense the homeowner incurred investigating their loss."}, {"k": "note", "h": "Why this matters", "t": "The carrier pays $18,650 against a $20,150 scope on the stated basis that the homeowner covers a $1,500 deductible. Credit $650 against that invoice and they pay $850 of a $1,500 deductible on carrier-paid work.\n\nThat looks like a courtesy. It's a partial deductible offset."}, {"k": "do", "h": "Where the credit belongs", "t": "Retail work, or something outside the carrier's scope. An upgrade, or work they're buying retail. Never against the scope, and never against the deductible.\n\nEither/or, never both. Reimbursed means no credit."}], "branches": [{"label": "Close it out", "to": null, "num": null, "dest": "Depreciation released. Final invoice. Done."}]}, {"id": "retail", "num": 50, "phase": "7", "title": "Retail", "sit": "", "blocks": [{"k": "do", "h": "The Two Ways sheet", "t": "Insurance timeline versus start-now, week by week. The trade-partner payment program is disclosed IN WRITING. Verbal framing is one thing, a written document that hides a loan is a different animal."}, {"k": "do", "h": "Upgrades are easy here", "t": "Nobody is writing a competing scope and nobody has to agree with your line items. Nine minutes instead of four emails and three weeks.\n\nRoughly $900 a square retail against $250-300 on claim work."}, {"k": "say", "h": "If it's a dead claim you're flipping", "t": "\"Do you not have the packet I left with you? The estimate's right there. I know it's been a few months and materials went up. I'll still honor that price.\"\n\nFull price, not salvage. They've been holding your number since before anything went wrong, and a price you honor three months later is the only proof the price was honest to begin with."}], "branches": [{"label": "Close it out", "to": null, "num": null, "dest": "Roof on in a couple of weeks."}]}]};
const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
let stack = [];

const el = s => document.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function render(id, push){
  const n = byId[id];
  if(!n) return;
  if(push !== false){ if(stack[stack.length-1] !== id) stack.push(id); }
  el('#phname').textContent = n.phase + ' · ' + (DATA.phases.find(p => p[0]===n.phase)||['',''])[1];
  el('#strip').innerHTML = DATA.phases.map(p => {
    const c = p[0] === n.phase ? 'on' : (p[0] < n.phase ? 'done' : '');
    return '<i class="'+c+'"></i>';
  }).join('');
  el('#cnt').textContent = 'Card ' + n.num + ' of ' + DATA.nodes.length;
  el('#back').disabled = stack.length < 2;

  let h = '<div class="pnum">'+n.num+'</div><h1>'+esc(n.title)+'</h1>';
  if(n.sit) h += '<div class="sit">'+esc(n.sit)+'</div>';
  h += '<div class="rule"></div>';
  for(const b of n.blocks){
    h += '<div class="b '+b.k+'"><div class="lab">'+esc(b.h)+'</div><div class="txt">'+esc(b.t)+'</div></div>';
  }
  h += '<div class="then"><div class="lab">Then</div>';
  n.branches.forEach((br,i) => {
    if(br.to) h += '<button class="br" data-go="'+br.to+'"><span class="go">'+br.num+'</span>'
                 + '<span class="t"><b>'+esc(br.label)+'</b><span>'+esc(br.dest)+'</span></span></button>';
    else      h += '<div class="br exit"><span class="go">END</span>'
                 + '<span class="t"><b>'+esc(br.label)+'</b><span>'+esc(br.dest)+'</span></span></div>';
  });
  h += '</div>';
  if(stack.length > 1){
    const path = stack.slice(0,-1).slice(-6).map(x =>
      '<a data-go="'+x+'">'+byId[x].num+' · '+esc(byId[x].title)+'</a>').join(' &nbsp;›&nbsp; ');
    h += '<div class="crumb"><b>How you got here:</b><br>'+path+'</div>';
  }
  el('#main').innerHTML = h;
  window.scrollTo(0,0);
  el('#main').querySelectorAll('[data-go]').forEach(b =>
    b.addEventListener('click', () => render(b.dataset.go)));
}

function buildIndex(filter){
  const f = (filter||'').toLowerCase().trim();
  let out = '', last = null;
  for(const n of DATA.nodes){
    const hay = (n.title+' '+n.sit+' '+n.blocks.map(b=>b.h+' '+b.t).join(' ')).toLowerCase();
    if(f && !hay.includes(f)) continue;
    if(n.phase !== last && !f){
      last = n.phase;
      out += '<div class="ph">'+n.phase+' · '+(DATA.phases.find(p=>p[0]===n.phase)||['',''])[1]+'</div>';
    }
    out += '<button class="ix" data-go="'+n.id+'"><b>'+n.num+'</b>'+esc(n.title)
        + (n.sit ? '<em>'+esc(n.sit)+'</em>' : '') + '</button>';
  }
  el('#list').innerHTML = out || '<p style="color:#5b636e;padding:12px 2px">Nothing matches that.</p>';
  el('#list').querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    el('#dlg').close(); render(b.dataset.go);
  }));
}

el('#menu').addEventListener('click', () => { buildIndex(el('#q').value); el('#dlg').showModal(); });
el('#close').addEventListener('click', () => el('#dlg').close());
el('#q').addEventListener('input', e => buildIndex(e.target.value));
el('#back').addEventListener('click', () => { if(stack.length>1){ stack.pop(); render(stack[stack.length-1], false); } });
el('#home').addEventListener('click', () => { stack = []; render(DATA.nodes[0].id); });
render(DATA.nodes[0].id);
</script><a href="index.html" style="position:fixed;left:10px;bottom:calc(12px + env(safe-area-inset-bottom));
 z-index:60;background:#15181c;color:#fff;text-decoration:none;font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 padding:9px 14px;border-radius:10px;box-shadow:0 3px 14px rgba(0,0,0,.28)">‹ Menu</a></body></html>
